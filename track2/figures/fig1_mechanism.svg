<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B76"/></marker></defs>
<rect width="920" height="600" fill="#ffffff"/>
<text x="460.0" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">One defect, two consequences, two therapeutic axes</text>
<rect x="250" y="44" width="420" height="52" rx="9" fill="#EEF1F4" stroke="#5F6B76" stroke-width="1.6"/>
<text x="460.0" y="66.0" text-anchor="middle" fill="#1F2933" font-size="13" font-weight="700">BUB1B biallelic loss of function</text>
<text x="460.0" y="83.0" text-anchor="middle" fill="#1F2933" font-size="13">L737* (null)  +  N1002K (hypomorph)</text>
<line x1="460" y1="96" x2="460" y2="124" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="240" y="126" width="440" height="56" rx="9" fill="#EEF1F4" stroke="#5F6B76" stroke-width="1.6"/>
<text x="460.0" y="150.0" text-anchor="middle" fill="#1F2933" font-size="12.5" font-weight="700">BUBR1 deficient — checkpoint complex weakened</text>
<text x="460.0" y="166.5" text-anchor="middle" fill="#1F2933" font-size="12.5">(spindle-assembly checkpoint)</text>
<line x1="380" y1="182" x2="232" y2="224" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="540" y1="182" x2="688" y2="224" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="226" width="380" height="54" rx="9" fill="#E3F4EE" stroke="#009E73" stroke-width="1.6"/>
<text x="230.0" y="249.0" text-anchor="middle" fill="#1F2933" font-size="13" font-weight="700">AXIS 1 — chromosome missegregation</text>
<text x="230.0" y="266.0" text-anchor="middle" fill="#1F2933" font-size="13">mosaic aneuploidy</text>
<line x1="230" y1="280" x2="230" y2="306" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="308" width="380" height="54" rx="9" fill="#F3FAF7" stroke="#009E73" stroke-width="1.6"/>
<text x="230.0" y="331.0" text-anchor="middle" fill="#1F2933" font-size="13">Tumour predisposition</text>
<text x="230.0" y="348.0" text-anchor="middle" fill="#1F2933" font-size="13">reported: rhabdomyosarcoma · Wilms tumour</text>
<line x1="230" y1="362" x2="230" y2="388" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="390" width="380" height="66" rx="9" fill="#F3FAF7" stroke="#009E73" stroke-width="1.6"/>
<text x="230.0" y="419.0" text-anchor="middle" fill="#1F2933" font-size="13">Aneuploid cells depend on AMPK / proteostasis</text>
<text x="230.0" y="436.0" text-anchor="middle" fill="#1F2933" font-size="13">→ exploit the metabolic &amp; proteotoxic stress</text>
<line x1="230" y1="456" x2="230" y2="478" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="480" width="380" height="62" rx="9" fill="#009E73" stroke="#007a5a" stroke-width="1.6"/>
<text x="230.0" y="507.0" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">METFORMIN</text>
<text x="230.0" y="524.5" text-anchor="middle" fill="#ffffff" font-size="11.5">AMPK · precedent in Fanconi anaemia (6–35 y)</text>
<rect x="500" y="226" width="380" height="54" rx="9" fill="#FDF1D6" stroke="#E69F00" stroke-width="1.6"/>
<text x="690.0" y="249.0" text-anchor="middle" fill="#1F2933" font-size="13" font-weight="700">AXIS 2 — BUBR1 insufficiency</text>
<text x="690.0" y="266.0" text-anchor="middle" fill="#1F2933" font-size="13">accelerated senescence (p21 / p15 / p16, SASP)</text>
<line x1="690" y1="280" x2="690" y2="306" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="500" y="308" width="380" height="54" rx="9" fill="#FEF8EA" stroke="#E69F00" stroke-width="1.6"/>
<text x="690.0" y="331.0" text-anchor="middle" fill="#1F2933" font-size="13">Progeroid features</text>
<text x="690.0" y="348.0" text-anchor="middle" fill="#1F2933" font-size="13">IUGR · failure to thrive · muscle atrophy</text>
<line x1="690" y1="362" x2="690" y2="388" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="500" y="390" width="380" height="66" rx="9" fill="#FEF8EA" stroke="#E69F00" stroke-width="1.6"/>
<text x="690.0" y="410.75" text-anchor="middle" fill="#1F2933" font-size="12.5">Senescent cells accumulate — proof of concept</text>
<text x="690.0" y="427.25" text-anchor="middle" fill="#1F2933" font-size="12.5">in the BubR1 hypomorph mouse (Baker 2011)</text>
<text x="690.0" y="443.75" text-anchor="middle" fill="#1F2933" font-size="12.5">→ senolysis</text>
<line x1="690" y1="456" x2="690" y2="478" stroke="#5F6B76" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="500" y="480" width="380" height="62" rx="9" fill="#E69F00" stroke="#b87f00" stroke-width="1.6"/>
<text x="690.0" y="507.0" text-anchor="middle" fill="#1F2933" font-size="13.5" font-weight="700">FISETIN</text>
<text x="690.0" y="524.5" text-anchor="middle" fill="#1F2933" font-size="11.5">adult regimen · no paediatric trial</text>
<rect x="716" y="120" width="168" height="62" rx="9" fill="#EAF1FA" stroke="#0072B2" stroke-width="1.6"/>
<text x="800.0" y="147.0" text-anchor="middle" fill="#1F2933" font-size="11.5" font-weight="700">NR  (adjuvant)</text>
<text x="800.0" y="162.5" text-anchor="middle" fill="#1F2933" font-size="11.5">NAD⁺ → SIRT2 → BUBR1</text>
<line x1="716" y1="151" x2="682" y2="151" stroke="#0072B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="800" y="202" text-anchor="middle" fill="#0072B2" font-size="10.5" font-style="italic">raises residual BUBR1? (pre-clinical)</text>
<rect x="20" y="118" width="214" height="76" rx="9" fill="#FBE9E1" stroke="#D55E00" stroke-width="1.6"/>
<text x="127.0" y="144.25" text-anchor="middle" fill="#1F2933" font-size="11.5" font-weight="700">The checkpoint is not a target</text>
<text x="127.0" y="159.75" text-anchor="middle" fill="#1F2933" font-size="11.5">pan-essential · 0 drugs</text>
<text x="127.0" y="175.25" text-anchor="middle" fill="#1F2933" font-size="11.5">(Open Targets / DepMap)</text>
<line x1="234" y1="156" x2="238" y2="156" stroke="#D55E00" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="110" y="560" width="700" height="28" rx="9" fill="#F5F6F8" stroke="#B8BFC7" stroke-width="1.6"/>
<text x="460.0" y="577.5" text-anchor="middle" fill="#1F2933" font-size="11">Tumour surveillance: renal ultrasound every 3 months, birth to age 7 (all MVA types) — independent of all agents</text>
</svg>